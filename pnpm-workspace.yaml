allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  sharp: true

autoDedupe: true

engineStrict: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - '@acdh-oeaw/content-lib@0.2.0'
  - '@acdh-oeaw/openapi-nextjs@0.0.4'

patchedDependencies:
  "@keystatic/core": patches/@keystatic__core.patch
  next: patches/next.patch

saveTypes: true

shellEmulator: true
