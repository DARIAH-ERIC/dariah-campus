name: Validate

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-validate"
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate
    if: ${{ !startsWith(github.head_ref, 'content/') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      NEXT_PUBLIC_APP_BASE_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_PRODUCTION_BASE_URL: "http://localhost:3000"
      NEXT_PUBLIC_TYPESENSE_COLLECTION: "dariah-campus"
      NEXT_PUBLIC_TYPESENSE_HOST: "localhost"
      NEXT_PUBLIC_TYPESENSE_PORT: "8108"
      NEXT_PUBLIC_TYPESENSE_PROTOCOL: "http"
      TYPESENSE_ADMIN_API_KEY: "xyz"

    strategy:
      fail-fast: true
      matrix:
        node-version: [24.x]
        os: [ubuntu-24.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Transform content
        run: pnpm run content:build

      - name: Generate metadata dump
        run: pnpm run generate:metadata-dump

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run types:check

      - name: Get playwright version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --json | jq --raw-output '.[0].devDependencies["@playwright/test"].version')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache playwright browsers
        uses: actions/cache@v5
        id: cache-playwright-browsers
        with:
          path: "~/.cache/ms-playwright"
          key: "${{ matrix.os }}-playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}"

      - name: Install playwright browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps
      - name: Install playwright browsers (operating system dependencies)
        if: steps.cache-playwright-browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      # https://nextjs.org/docs/pages/building-your-application/deploying/ci-build-caching#github-actions
      - name: Cache Next.js build output
        uses: actions/cache@v5
        with:
          path: "${{ github.workspace }}/.next/cache"
          key: "${{ matrix.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}"

      - name: Start typesense server and populate search index
        run: |
          set -euo pipefail
          pnpm run dev:services:up
          echo "Waiting for Typesense to be ready..."
          until curl -s -o /dev/null -w "%{http_code}" -H "X-TYPESENSE-API-KEY: $TYPESENSE_ADMIN_API_KEY" http://localhost:8108/health | grep -q 200; do
            echo -n "."
            sleep 1
          done
          pnpm run search:collections:create
          pnpm run search:collections:update
          SEARCH_API_KEY="$(pnpm --silent run search:api-keys:generate --raw)"
          if [ -z "$SEARCH_API_KEY" ]; then
            echo "Failed to generate search api key." >&2
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_TYPESENSE_SEARCH_API_KEY=$SEARCH_API_KEY"
            echo "TYPESENSE_SEARCH_API_KEY=$SEARCH_API_KEY"
          } >> "$GITHUB_ENV"

      - name: Build app
        run: pnpm run build

      - name: Run e2e tests
        run: pnpm run test:e2e

      - name: Stop typesense server
        run: pnpm run dev:services:down

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
